kind: Environment
version: 1.0.0
name: grpc-external-file-and-buf-module

spec:
  services:
    - id: grpc-service
      kind: grpc
      mode: real
      address: 127.0.0.1:8083

      proto:
        external:
          file: services/ok-grpc/ok.proto
          buf_module: buf.build/example/ok
          service: ok.v1.OKService