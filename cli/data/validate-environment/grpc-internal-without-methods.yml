kind: Environment
version: 1.0.0
name: grpc-internal-without-methods

spec:
  services:
    - id: grpc-service
      kind: grpc
      mode: mocked
      address: 127.0.0.1:8083

      proto:
        internal:
          package: ok.v1
          service: OKService
          methods: []

      fixtures:
        - when:
            grpc:
              method: OK
          then:
            grpc:
              status: OK