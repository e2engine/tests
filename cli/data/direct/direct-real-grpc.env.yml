kind: Environment
version: 1.0.0
name: direct-real-grpc
description: one real gRPC service that returns OK for OK
spec:
  services:
    - id: direct-real-grpc
      kind: grpc
      mode: real
      address: 127.0.0.1:8083
      grpc_target: 127.0.0.1:9000
      proto:
        external:
          file: ../../services/ok-grpc/ok.proto
          service: ok.v1.OKService
