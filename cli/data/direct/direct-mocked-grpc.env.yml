kind: Environment
version: 1.0.0
name: direct-mocked-grpc
description: one mocked gRPC service that returns OK for CheckEntitlement
spec:
  services:
    - id: direct-mocked-grpc
      kind: grpc
      mode: mocked
      address: 127.0.0.1:8083
      proto:
        internal:
          package: entitlements.v1
          service: EntitlementsService
          methods:
            - name: CheckEntitlement
              request:
                fields:
                  - name: customer_id
                    type: string
              response:
                fields:
                  - name: entitled
                    type: bool
      fixtures:
        - when:
            grpc:
              method: CheckEntitlement
              message:
                customer_id: customer-1
          then:
            grpc:
              status: OK
              message:
                entitled: true
