kind: Environment
version: 1.0.0
name: real-with-mocked-dependency
description: real HTTP service calling a mocked HTTP dependency
spec:
  services:
    - id: gateway
      kind: http
      mode: real
      address: 127.0.0.1:8082
      http_target: http://127.0.0.1:9000
    - id: entitlements
      kind: http
      mode: mocked
      address: 127.0.0.1:8083
      fixtures:
        - when:
            http:
              method: GET
              path: /healthz
          then:
            http:
              status: 200
              headers:
                Content-Type:
                  - application/json
              body: '{"status":"ok"}'