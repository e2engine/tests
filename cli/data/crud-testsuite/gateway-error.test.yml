kind: Test
version: 1.0.0
name: gateway-error
description: calls gateway error endpoint and verifies the response is ok
spec:
  tags:
    - e2e
  request:
    http:
      method: GET
      url: http://127.0.0.1:9000/error
  expect:
    http:
      status_code: 200
      body_json: '{"status":"ok"}'
