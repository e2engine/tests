kind: Environment
version: 1.0.0
name: socket-grpc-error
description: one real gRPC service with a missing proto file
spec:
  services:
    - id: socket-grpc-error
      kind: grpc
      mode: real
      address: 127.0.0.1:8083
      grpc_target: 127.0.0.1:9000
      proto:
        external:
          file: ../services/ok-grpc/missing.proto
          service: ok.v1.OKService
