kind: environment
version: 1.0.0
name: one-of-two-mocked-not-called
description: two mocked services
spec:
  services:
    - id: called
      kind: http
      mode: mocked
      address: 127.0.0.1:8082
      fixtures:
        - when:
            http:
              method: GET
              path: /healthz
          then:
            http:
              status: 200

    - id: not-called
      kind: http
      mode: mocked
      address: 127.0.0.1:8083
      fixtures:
        - when:
            http:
              method: GET
              path: /healthz
          then:
            http:
              status: 200