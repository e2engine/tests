kind: Environment
version: 1.0.0
name: misspelled-fails-validation
description: one mocked HTTP service that returns 200 OK for /healthz
spec:
  services:
    - id: spelled-correctly
      kind: http
      mode: mocked
      address: 127.0.0.1:8083
      fixtures:
        - when:
            http:
              method: GET
              path: /healthz
          then:
            http:
              status_code: 200
