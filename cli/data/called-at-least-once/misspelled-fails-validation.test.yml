kind: Test
version: 1.0.0
name: misspelled-fails-validation
description: validation fails because the service_id in the expect.calls is misspelled
spec:
  request:
    http:
      method: GET
      url: http://127.0.0.1:8083/healthz
  expect:
    http:
      status_code: 200
    calls:
      - service_id: misspelled
        http:
          method: GET
          path: /healthz