kind: Environment
version: 1.0.0
name: fixture-miss-grpc-method
description: real HTTP service calling a mocked gRPC dependency

spec:
  services:
    - id: gateway
      kind: http
      mode: real
      address: 127.0.0.1:8082
      http_target: http://127.0.0.1:9000

    - id: entitlements
      kind: grpc
      mode: mocked
      address: 127.0.0.1:8083

      proto:
        internal:
          package: entitlements.v1
          service: EntitlementsService
          methods:
            - name: CheckEntitlement
              request:
                fields:
                  - name: customer_id
                    type: string
              response:
                fields:
                  - name: entitled
                    type: bool
            - name: UnknownMethod
              request:
                fields:
                  - name: customer_id
                    type: string
              response:
                fields:
                  - name: entitled
                    type: bool

      fixtures:
        - when:
            grpc:
              method: CheckEntitlement
              message:
                customer_id: customer-1
          then:
            grpc:
              status: OK
              message:
                entitled: true