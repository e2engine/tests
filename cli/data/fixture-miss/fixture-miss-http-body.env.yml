kind: Environment
version: 1.0.0
name: fixture-miss-http-body
description: real HTTP service calling a mocked HTTP dependency
spec:
  services:
    - id: gateway
      kind: http
      mode: real
      address: 127.0.0.1:8082
      http_target: http://127.0.0.1:9000
    - id: entitlements
      kind: http
      mode: mocked
      address: 127.0.0.1:8083
      fixtures:
        - when:
            http:
              method: POST
              path: /healthz
              body: '{"customer_id":"customer-2"}'
          then:
            http:
              status: 200
              body: '{"status":"ok"}'