kind: Test
version: 1.0.0
name: grpc-call-valid

spec:
  request:
    grpc:
      target: 127.0.0.1:8083
      service: example.v1.Service
      method: Check

  expect:
    grpc:
      status: OK

    calls:
      - service_id: grpc-dependency
        grpc:
          service: dependency.v1.Service
          method: Check