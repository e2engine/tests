kind: Test
version: 1.0.0
name: grpc-call-all-optional-fields-valid

spec:
  request:
    grpc:
      target: 127.0.0.1:8081
      service: TestService
      method: Test

  expect:
    grpc:
      status: OK
    calls:
      - service_id: dependency
        count: 1
        grpc:
          service: DependencyService
          method: Call
          metadata:
            authorization:
              - token
          message:
            value: test