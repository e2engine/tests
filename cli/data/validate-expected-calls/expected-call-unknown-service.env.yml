kind: Environment
version: 1.0.0
name: expected-call-unknown-service
description: environment with one mocked HTTP service

spec:
  services:
    - id: known-service
      kind: http
      mode: mocked
      address: 127.0.0.1:8082
      fixtures:
        - when:
            http:
              method: GET
              path: /healthz
          then:
            http:
              status: 200