kind: Environment
version: 1.0.0
name: expected-http-call-to-grpc-service
description: environment with HTTP entry service and gRPC dependency

spec:
  services:
    - id: entry
      kind: http
      mode: mocked
      address: 127.0.0.1:8082
      fixtures:
        - when:
            http:
              method: GET
              path: /healthz
          then:
            http:
              status: 200

    - id: grpc-dependency
      kind: grpc
      mode: mocked
      address: 127.0.0.1:9090
      proto:
        internal:
          package: example
          service: Dependency
          methods:
            - name: Check
      fixtures:
        - when:
            grpc:
              method: Check
          then:
            grpc:
              status: OK