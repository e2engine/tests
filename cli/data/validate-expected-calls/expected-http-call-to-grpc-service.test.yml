kind: Test
version: 1.0.0
name: expected-http-call-to-grpc-service
description: HTTP call expectation references a gRPC environment service

spec:
  request:
    http:
      method: GET
      url: http://127.0.0.1:8082/healthz

  expect:
    http:
      status: 200

    calls:
      - service_id: grpc-dependency
        http:
          method: GET
          path: /healthz