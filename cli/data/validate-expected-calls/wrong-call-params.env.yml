kind: Environment
version: 1.0.0
name: wrong-call-params
description: one mocked HTTP service that returns 200 OK for /healthz
spec:
  services:
    - id: wrong-call-params
      kind: http
      mode: mocked
      address: 127.0.0.1:8083
      fixtures:
        - when:
            http:
              method: GET
              path: /healthz
          then:
            http:
              status: 200
