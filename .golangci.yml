version: "2"
output:
  formats:
    text:
      path: stdout

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - gomoddirectives
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: Use `errors` package from the standard library
    dupl:
      threshold: 100
    funlen:
      lines: 120
      statements: 60
      ignore-comments: true
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
    gocyclo:
      min-complexity: 25
    gosec:
      excludes:
        - G115
    govet:
      enable:
        - shadow
    nakedret:
      max-func-lines: 50

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: ^util/compare_.*\.go$
        linters:
          - dupl

      - path: ^services/.*\.go$
        linters:
          - gosec
        text: G114

      - path: ^services/.*\.go$
        linters:
          - noctx

      - path: ^(cli|docker)/harness/(harness|service)\.go$
        linters:
          - gosec
        text: G204

      - path: ^docker/harness/(harness|service)\.go$
        linters:
          - goconst
          - noctx
          - prealloc

      - path: _test\.go$
        linters:
          - dogsled
          - dupl
          - funlen
          - goconst
          - gocritic
          - gocyclo
          - gosec
          - govet
          - lll
          - revive
          - staticcheck
          - unparam
    paths:
      - vendor

formatters:
  enable:
    - gci
    - gofmt
    - goimports

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/e2engine/tests)
    goimports:
      local-prefixes:
        - github.com/e2engine/tests

  exclusions:
    generated: lax
    paths:
      - vendor
